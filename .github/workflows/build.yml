name: Build NeuroChat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y git zip unzip wget autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake build-essential
        pip install --upgrade pip
        pip install buildozer cython==3.0.11

    - name: Set up Android SDK
      run: |
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

    - name: Install SDK packages
      run: |
        yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
        sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
        echo "$HOME/android-sdk/build-tools/33.0.2" >> $GITHUB_PATH
        echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "ANDROIDSDK=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROIDNDK=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-linux

    - name: Build APK
      run: |
        pip install --upgrade buildozer cython==3.0.11
        rm -rf .buildozer/android/platform/build-*/dists
        yes | buildozer android debug 2>&1 | tee /tmp/build.log
        # Патчим манифест напрямую
        MANIFEST=$(find .buildozer -name "AndroidManifest.xml" | grep "dists" | head -1)
        if [ -f "$MANIFEST" ]; then
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|g' "$MANIFEST"
          echo "Patched: $MANIFEST"
          cat "$MANIFEST"
        fi
        # Пересобираем только APK без полной компиляции
        cd .buildozer/android/platform/build-arm64-v8a/dists/neurochat
        ./gradlew assembleDebug 2>&1 | tail -20
        # Копируем пересобранный APK в bin/
        mkdir -p bin
        find .buildozer -name "*.apk" -path "*/outputs/*" | xargs -I{} cp {} bin/ 2>/dev/null || true
        find .buildozer -name "*debug*.apk" | xargs -I{} cp {} bin/ 2>/dev/null || true
        ls -la bin/
        cd $GITHUB_WORKSPACE
        echo "=== Searching APK ==="
        find / -name "*.apk" -not -path "*/android-sdk/*" 2>/dev/null || echo "No APK found"
        echo "=== bin dir ==="
        ls -la bin/ 2>/dev/null || echo "No bin dir"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: neurochat-apk
        path: |
          bin/*.apk
          .buildozer/**/*.apk
        if-no-files-found: warn
        retention-days: 30
