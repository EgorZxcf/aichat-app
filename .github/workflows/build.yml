name: Build NeuroChat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y git zip unzip wget autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake build-essential apksigner
        pip install --upgrade pip
        pip install buildozer cython==3.0.11

    - name: Set up Android SDK
      run: |
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

    - name: Install SDK packages
      run: |
        yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
        sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
        echo "$HOME/android-sdk/build-tools/33.0.2" >> $GITHUB_PATH
        echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "ANDROIDSDK=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROIDNDK=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Build APK
      run: |
        yes | buildozer android debug 2>&1 | tee /tmp/build.log
        ls -la bin/ 2>/dev/null || echo "No bin dir"

    - name: Patch APK - enable cleartext
      run: |
        APK=$(find bin -name "*.apk" | head -1)
        echo "APK: $APK"
        # Распаковываем APK
        mkdir -p apk_patch
        cp "$APK" apk_patch/original.apk
        cd apk_patch
        unzip -q original.apk
        # Декодируем манифест
        python3 - << 'PYEOF'
        import subprocess, os, sys
        # Используем aapt2 для просмотра
        result = subprocess.run(['aapt2', 'dump', 'xmltree', '--file', 'AndroidManifest.xml', 'original.apk'], capture_output=True, text=True)
        print(result.stdout[:2000])
        PYEOF
        cd ..
        # Патчим через gradlew
        DIST=.buildozer/android/platform/build-arm64-v8a/dists/neurochat
        MANIFEST=$DIST/src/main/AndroidManifest.xml
        echo "=== Before patch ==="
        grep -i "cleartext\|application" "$MANIFEST" | head -5
        # Патчим
        sed -i 's|android:allowBackup|android:usesCleartextTraffic="true" android:allowBackup|g' "$MANIFEST"
        echo "=== After patch ==="
        grep -i "cleartext\|application" "$MANIFEST" | head -5
        # Пересобираем
        cd $DIST
        ./gradlew assembleDebug 2>&1 | tail -10
        cd $GITHUB_WORKSPACE
        # Копируем новый APK
        find .buildozer -name "*.apk" -path "*/outputs/apk/*" -exec cp {} bin/ \;
        echo "=== Final bin ==="
        ls -la bin/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: neurochat-apk
        path: bin/*.apk
        if-no-files-found: error
        retention-days: 30
