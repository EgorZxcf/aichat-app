name: Build NeuroChat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest

    steps:
    - uses: actions/checkout@v4

    - name: Build APK
      run: |
        yes | buildozer android debug
        echo "=== Finding APK files ==="
        find / -name "*.apk" 2>/dev/null
        echo "=== bin directory ==="
        ls -la bin/ 2>/dev/null || echo "No bin dir"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: neurochat-apk
        path: |
          bin/*.apk
          **/*.apk
        if-no-files-found: warn
        retention-days: 30
