name: Build NeuroChat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          git zip unzip wget \
          openjdk-17-jdk \
          autoconf libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libffi-dev \
          libssl-dev \
          cmake \
          build-essential
        pip install --upgrade pip
        pip install buildozer cython==3.0.3

    - name: Set up Android SDK and NDK
      run: |
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

    - name: Install SDK packages
      run: |
        yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
        sdkmanager --sdk_root=$HOME/android-sdk \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2" \
          "ndk;28.0.12433566"
        echo "$HOME/android-sdk/build-tools/33.0.2" >> $GITHUB_PATH
        echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/28.0.12433566" >> $GITHUB_ENV
        echo "ANDROIDNDK=$HOME/android-sdk/ndk/28.0.12433566" >> $GITHUB_ENV
        echo "ANDROIDSDK=$HOME/android-sdk" >> $GITHUB_ENV

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

    - name: Build APK
      run: |
        yes | buildozer android debug 2>&1 | tee /tmp/build.log
        echo "=== APK files ==="
        find . -name "*.apk" 2>/dev/null

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: neurochat-apk
        path: bin/*.apk
        retention-days: 30

    - name: Upload log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: /tmp/build.log
        retention-days: 7
